<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a14">
<meta name="description" content="Realidad aumentada navideña: detecta ventanas, paredes y árboles con la cámara y los decora.">
<title>Navidad AR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="out"></canvas>

<header id="ui">
  <button id="start" class="primary">Empezar</button>
  <div id="toggles">
    <label class="chip window"><input type="checkbox" id="fx-window" checked> Ventanas</label>
    <label class="chip tree"><input type="checkbox" id="fx-tree" checked> Árboles</label>
    <label class="chip wall"><input type="checkbox" id="fx-wall" checked> Paredes</label>
    <label class="chip"><input type="checkbox" id="fx-debug"> Ver máscaras</label>
  </div>
  <p id="status" role="status" aria-live="polite">Pulsa Empezar y permite el acceso a la cámara.</p>
  <div id="progress" hidden><div id="bar"></div></div>
</header>

<footer id="actions" hidden>
  <button id="flip" title="Cambiar de cámara" aria-label="Cambiar de cámara">🔄</button>
  <button id="photo" class="primary round" title="Hacer foto" aria-label="Hacer foto">📸</button>
  <button id="pause" title="Pausar" aria-label="Pausar">⏸️</button>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
